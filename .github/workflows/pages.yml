# Publishes the project page (site/index.html) with GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish the project page

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page files
        run: |
          mkdir _site
          cp site/index.html _site/
          if [ -f site/og.png ]; then cp site/og.png _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
