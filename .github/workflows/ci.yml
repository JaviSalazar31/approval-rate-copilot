# Tests on every push and pull request: feed contracts, forecast alert, the whole pipeline on local Spark,
# the incident analysis, and a check that every generated file (Databricks notebooks, docs, project page)
# is up to date with its sources.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests (no Spark)
        run: python -m pytest -q tests/test_feed_checks.py tests/test_volume_forecast.py

      - name: Generate the synthetic data
        run: python data_generator/generate_data.py --out data/full --seed 42

      - name: Check every day of every feed against its contract
        run: python checks/feed_checks.py --data data/full --all-dates > feed_checks.txt || (tail -40 feed_checks.txt; exit 1)

      - name: Run the pipeline on local Spark
        run: python local/run_local.py

      - name: Pipeline, alert and analysis tests
        run: python -m pytest -q tests

      - name: Analysis results and generated files match their sources
        env:
          REPO_URL: https://github.com/JaviSalazar31/approval-rate-copilot
          SITE_URL: https://javisalazar31.github.io/approval-rate-copilot/
        run: |
          python analysis/incident_impact.py > /dev/null
          python analysis/mix_rate_split.py > /dev/null
          python tools/build_databricks.py
          python tools/build_docs.py
          python tools/build_deploy_payloads.py
          python tools/export_site_data.py
          python tools/build_site.py
          git diff --stat --exit-code -- . ':(exclude)site/artifact.html'
