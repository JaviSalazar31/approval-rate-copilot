# Databricks Asset Bundle: the pipelines, the jobs and the dashboard, deployed by GitHub Actions
# (.github/workflows/deploy.yml). Genie spaces have no bundle resource: the approval_copilot_update_agent
# job applies databricks/genie/approval_copilot_agent.json when a release asks for it.
# Generated by tools/build_databricks.py from the same definitions as databricks/jobs/. Do not edit by hand.
bundle:
  name: approval-rate-copilot
variables:
  warehouse_id:
    description: SQL warehouse for dbt, the dashboard and the Genie agent
    lookup:
      warehouse: Serverless Starter Warehouse
sync:
  exclude:
  - site/**
  - evals/results/**
  - analysis/results/**
  - data/sample/**
targets:
  prod:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
resources:
  pipelines:
    approval_copilot:
      name: approval_copilot
      catalog: workspace
      schema: approval_copilot
      serverless: true
      libraries:
      - file:
          path: ./databricks/pipeline/approval_copilot_pipeline.sql
    approval_copilot_late_cdc:
      name: approval_copilot_late_cdc
      catalog: workspace
      schema: approval_copilot_cdc
      serverless: true
      libraries:
      - file:
          path: ./databricks/pipeline/late_cdc_test.sql
  jobs:
    approval_copilot_daily:
      name: approval_copilot_daily
      description: 'Approval Rate Copilot: land the synthetic feeds, check them against their contracts, refresh the pipeline,
        build and test the gold tables with dbt, run the forecast alert, recreate the copilot functions and column descriptions,
        and apply governance tags. Generated by tools/build_databricks.py.'
      parameters:
      - name: run_date
        default: ''
      - name: regenerate_data
        default: 'false'
      email_notifications:
        on_failure:
        - ${workspace.current_user.userName}
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: 0 0 7 * * ?
        timezone_id: America/Bogota
        pause_status: PAUSED
      tags:
        project: approval-rate-copilot
        data: synthetic
      environments:
      - environment_key: dbt
        spec:
          environment_version: '4'
          dependencies:
          - dbt-databricks>=1.10,<2
      tasks:
      - task_key: setup
        notebook_task:
          notebook_path: ./databricks/notebooks/00_setup.sql
          source: WORKSPACE
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
        timeout_seconds: 3600
      - task_key: land_data
        depends_on:
        - task_key: setup
        notebook_task:
          notebook_path: ./databricks/notebooks/01_generate_data.py
          source: WORKSPACE
          base_parameters:
            regenerate_data: '{{job.parameters.regenerate_data}}'
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
        timeout_seconds: 3600
      - task_key: check_feeds
        depends_on:
        - task_key: land_data
        notebook_task:
          notebook_path: ./databricks/notebooks/06_check_feeds.py
          source: WORKSPACE
          base_parameters:
            run_date: '{{job.parameters.run_date}}'
            regenerate_data: '{{job.parameters.regenerate_data}}'
        max_retries: 0
        timeout_seconds: 3600
      - task_key: refresh_pipeline
        depends_on:
        - task_key: check_feeds
        pipeline_task:
          pipeline_id: ${resources.pipelines.approval_copilot.id}
          full_refresh: false
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
        timeout_seconds: 3600
      - task_key: dbt_build
        depends_on:
        - task_key: refresh_pipeline
        dbt_task:
          project_directory: ${workspace.file_path}/dbt
          commands:
          - dbt build
          warehouse_id: ${var.warehouse_id}
          catalog: workspace
          schema: approval_copilot
          source: WORKSPACE
        environment_key: dbt
        max_retries: 0
        timeout_seconds: 3600
      - task_key: volume_alerts
        depends_on:
        - task_key: dbt_build
        notebook_task:
          notebook_path: ./databricks/notebooks/07_volume_alerts.py
          source: WORKSPACE
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
        timeout_seconds: 3600
      - task_key: copilot_functions
        depends_on:
        - task_key: dbt_build
        notebook_task:
          notebook_path: ./databricks/notebooks/04_copilot_functions.sql
          source: WORKSPACE
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
        timeout_seconds: 3600
      - task_key: column_comments
        depends_on:
        - task_key: dbt_build
        notebook_task:
          notebook_path: ./databricks/notebooks/05_column_comments.py
          source: WORKSPACE
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
        timeout_seconds: 3600
      - task_key: metric_views
        depends_on:
        - task_key: dbt_build
        notebook_task:
          notebook_path: ./databricks/notebooks/09_metric_views.py
          source: WORKSPACE
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
        timeout_seconds: 3600
      - task_key: governance
        depends_on:
        - task_key: volume_alerts
        - task_key: copilot_functions
        - task_key: column_comments
        - task_key: metric_views
        notebook_task:
          notebook_path: ./databricks/notebooks/08_governance.py
          source: WORKSPACE
        max_retries: 2
        min_retry_interval_millis: 60000
        retry_on_timeout: true
        timeout_seconds: 3600
    approval_copilot_eval:
      name: approval_copilot_eval
      description: 'Approval Rate Copilot: ask the Genie agent a question set and log each answer to MLflow as a trace (latency,
        SQL, guardrail checks), or attach graded verdicts to a run. Generated by tools/build_databricks.py.'
      parameters:
      - name: action
        default: ask
      - name: question_set
        default: benchmark
      - name: run_name
        default: ''
      - name: graded_path
        default: ''
      email_notifications:
        on_failure:
        - ${workspace.current_user.userName}
        no_alert_for_skipped_runs: true
      max_concurrent_runs: 1
      timeout_seconds: 7200
      schedule:
        quartz_cron_expression: 0 0 8 ? * MON
        timezone_id: America/Bogota
        pause_status: PAUSED
      tags:
        project: approval-rate-copilot
        data: synthetic
      tasks:
      - task_key: evaluate
        notebook_task:
          notebook_path: ./databricks/notebooks/11_evaluate_agent.py
          source: WORKSPACE
          base_parameters:
            action: '{{job.parameters.action}}'
            question_set: '{{job.parameters.question_set}}'
            run_name: '{{job.parameters.run_name}}'
            graded_path: '{{job.parameters.graded_path}}'
        max_retries: 0
        timeout_seconds: 7200
    approval_copilot_update_agent:
      name: approval_copilot_update_agent
      description: 'Approval Rate Copilot: check and apply the serialized Genie space and the dashboard file from the repository.
        Generated by tools/build_databricks.py.'
      max_concurrent_runs: 1
      tags:
        project: approval-rate-copilot
        data: synthetic
      tasks:
      - task_key: update_agent
        notebook_task:
          notebook_path: ./databricks/notebooks/10_update_agent.py
          source: WORKSPACE
          base_parameters:
            space_json_path: ${workspace.file_path}/databricks/genie/approval_copilot_agent.json
            dashboard_json_path: ''
            warehouse_id: ${var.warehouse_id}
        max_retries: 0
        timeout_seconds: 1800
    approval_copilot_late_cdc_test:
      name: approval_copilot_late_cdc
      description: 'Approval Rate Copilot: late-data test for AUTO CDC. Lands two batches of synthetic acquirer status events
        in the schema approval_copilot_cdc, the second late and out of order, updates the approval_copilot_late_cdc pipeline
        after each, and checks that the current status follows the acquirer''s sequence, not the arrival order. Touches none
        of the copilot''s tables. Generated by tools/build_databricks.py.'
      max_concurrent_runs: 1
      tags:
        project: approval-rate-copilot
        data: synthetic
      tasks:
      - task_key: land_batch_1
        notebook_task:
          notebook_path: ./databricks/notebooks/12_late_cdc_feed.py
          source: WORKSPACE
          base_parameters:
            batch: '1'
        max_retries: 0
        timeout_seconds: 1800
      - task_key: update_after_batch_1
        depends_on:
        - task_key: land_batch_1
        pipeline_task:
          pipeline_id: ${resources.pipelines.approval_copilot_late_cdc.id}
          full_refresh: true
        max_retries: 0
        timeout_seconds: 1800
      - task_key: land_batch_2_late
        notebook_task:
          notebook_path: ./databricks/notebooks/12_late_cdc_feed.py
          source: WORKSPACE
          base_parameters:
            batch: '2'
        max_retries: 0
        timeout_seconds: 1800
        depends_on:
        - task_key: update_after_batch_1
      - task_key: update_after_batch_2
        depends_on:
        - task_key: land_batch_2_late
        pipeline_task:
          pipeline_id: ${resources.pipelines.approval_copilot_late_cdc.id}
          full_refresh: false
        max_retries: 0
        timeout_seconds: 1800
      - task_key: check
        notebook_task:
          notebook_path: ./databricks/notebooks/13_late_cdc_check.py
          source: WORKSPACE
        max_retries: 0
        timeout_seconds: 1800
        depends_on:
        - task_key: update_after_batch_2
  dashboards:
    approval_health:
      display_name: Approval Health
      file_path: ./databricks/dashboard/approval_health.lvdash.json
      parent_path: /Workspace/Users/${workspace.current_user.userName}/approval-rate-copilot
      warehouse_id: ${var.warehouse_id}
      embed_credentials: true
