# Data contract for Acquirer A's authorization responses (ISO-8601 UTC timestamps, decimal amounts).
feed: acquirer_a
description: Authorization responses from Acquirer A, one row per attempt (webhook re-deliveries included)
delivery: one CSV file per business day, named YYYY-MM-DD.csv
format: {type: csv, delimiter: ",", header: true, encoding: utf-8}
max_invalid_share: 0.01
# First attempts in this file against the payments the orchestrator routed to this acquirer on the
# same day. A routing change moves both sides together, so it does not trip the check; a truncated or
# duplicated delivery does.
reconciliation: {orchestrator_column: first_acquirer, acquirer: A, attempt_column: attempt_seq, first_attempt: '1', min_ratio: 0.98, max_ratio: 1.02}
columns:
  - {name: event_id, type: string, pattern: '^evt_a_[0-9a-f]{14}$'}
  - {name: payment_ref, type: string, pattern: '^pay_[0-9a-f]{12}$'}
  - {name: merchant_ref, type: string, pattern: '^(MX|CO|BR)-M[0-9]{2}$'}
  - {name: created_at_utc, type: timestamp, format: '%Y-%m-%dT%H:%M:%S.%fZ'}
  - {name: amount, type: decimal, separator: '.'}
  - {name: currency, type: enum, values: [MXN, COP, BRL]}
  - {name: country, type: enum, values: [MX, CO, BR]}
  - {name: card_brand, type: enum, values: [VISA, MASTERCARD, AMEX, ELO]}
  - {name: card_type, type: enum, values: [credit, debit]}
  - {name: issuer_ref, type: string, pattern: '^(MX|CO|BR|INTL)-ISS-[0-9]{2}$'}
  - {name: is_3ds, type: enum, values: ['true', 'false']}
  - {name: installments, type: integer}
  - {name: status, type: enum, values: [APPROVED, DECLINED, ERROR, TIMEOUT, VOIDED]}
  - {name: response_code, type: string, pattern: '^[0-9A-Z]{2}$', nullable: true}
  - {name: latency_ms, type: integer}
  - {name: attempt_seq, type: enum, values: ['1', '2']}
  - {name: received_at_utc, type: timestamp, format: '%Y-%m-%dT%H:%M:%S.%fZ'}
