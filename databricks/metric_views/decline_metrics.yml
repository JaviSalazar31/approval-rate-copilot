# Unity Catalog metric view over gold_decline_reasons_daily. Created by notebook 09.
version: 1.1
comment: Failed authorization attempts per day, country, card type, acquirer and canonical reason, with how the decline-code map classified each code at the time.
source: workspace.approval_copilot.gold_decline_reasons_daily
dimensions:
  - name: business_date
    expr: business_date
    comment: Local calendar date of the attempt (country time zone)
  - name: country
    expr: country
    comment: MX, CO or BR
  - name: card_type
    expr: card_type
    comment: credit or debit
  - name: acquirer
    expr: acquirer_id
    comment: Acquirer that processed the attempt (A, B or C)
  - name: attempt
    expr: CASE WHEN attempt_seq = 1 THEN 'first attempt' ELSE 'retry' END
    comment: First attempt, or the retry on a second acquirer
  - name: reason_code
    expr: reason_code
    comment: ISO 8583 response code after normalization, or the canonical status for technical failures
  - name: reason
    expr: reason
    comment: Reason in plain words
  - name: decline_type
    expr: decline_type
    comment: soft, hard or technical, as the map classified the code at that time
  - name: retryable
    expr: retryable
    comment: Whether the map allowed a retry on another acquirer
  - name: mapping_version
    expr: mapping_version
    comment: Version of the decline-code map in force (v2.2, v2.3, v2.3.1)
measures:
  - name: failed_attempts
    expr: SUM(attempts)
    comment: Authorization attempts the issuer or the acquirer did not approve
